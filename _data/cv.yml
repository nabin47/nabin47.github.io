  sections:
    summary:
      - Lecturer and researcher in Computer Science & Engineering at IUBAT, Dhaka.
        Research focuses on federated learning, intrusion detection systems, explainable
        AI (SHAP/LIME), adversarial machine learning, and video anomaly detection.
        Author of 7 peer-reviewed papers at IEEE and Springer venues.

    education:
      - institution: Chittagong University of Engineering & Technology (CUET)
        area: Computer Science and Engineering
        degree: B.Sc.
        start_date: 2018-09
        end_date: 2023-06
        highlights:
          - "CGPA: 3.64 / 4.00"
          - "Relevant Coursework: Machine Learning, Data Structures & Algorithms,
            Computer Networks, Database Management Systems, Artificial Intelligence,
            Software Engineering"

    experience:
      - company: International University of Business Agriculture and Technology (IUBAT)
        position: Lecturer, Department of CSE
        location: Dhaka, Bangladesh
        start_date: 2023-01
        highlights:
          - "Courses taught: Artificial Intelligence, Data Science, Data Structures,
            Database Management Systems, System Analysis & Design"
          - Mentored 35+ undergraduate students on ML and cybersecurity research
            projects; two student-led projects advanced to peer-reviewed publication
            (IEEE PECCII 2026, IEEE ICMI 2026)

      - company: CUET / IUBAT
        position: Researcher — Machine Learning & Cybersecurity
        location: Dhaka, Bangladesh
        start_date: 2022-01
        highlights:
          - Developed a privacy-preserving CNN-LSTM architecture within a Federated
            Learning framework for network intrusion detection, achieving over 99.36%
            accuracy across all seven attack classes on CIC-IDS2017 without centralizing
            raw data; raised F1-score on the hardest class (Web Attack) from 0.20
            (CNN baseline) to 0.93, outperforming LSTM, CNN+BiLSTM, and CNN+GRU variants
          - Built a novel file-entropy dataset and detection pipeline for crypto-ransomware,
            developing a custom FUSE-based filesystem to intercept and log file
            write/delete operations across 123 file types (30 ransomware strains,
            93 benign); trained ML models achieving up to 96% accuracy (first-author,
            Springer LNNS 2025)
          - Evaluated cross-domain adversarial robustness and XAI explanation stability
            in phishing detection, comparing PGD and Carlini-Wagner attack accuracy
            alongside SHAP explanation drift across feature-engineered vs. raw-URL
            input representations (IEEE PECCII 2026)
          - Designed a two-stage CNN + Vision Transformer pipeline for video anomaly
            detection on the UCF-Crime dataset, reaching 98% accuracy on binary
            classification and 95% on multi-class categorization; introduced a keyframe
            extraction algorithm cutting per-video processing time to 20ms

