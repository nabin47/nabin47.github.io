- title: Experience
  type: time_table
  contents:
    - title: Lecturer, Department of CSE
      institution: International University of Business Agriculture and Technology (IUBAT), Dhaka
      year: 2023 – Present
      description:
        - "Courses: Artificial Intelligence, Data Science, Data Structures,
          Database Management Systems, System Analysis & Design"
        - Mentored 35+ undergraduate students on ML and cybersecurity research
          projects; two student-led projects advanced to peer-reviewed publication
          (IEEE PECCII 2026, IEEE ICMI 2026)

    - title: Researcher — Machine Learning & Cybersecurity
      institution: CUET / IUBAT, Dhaka
      year: 2022 – Present
      description:
        - Developed a privacy-preserving CNN-LSTM architecture within a Federated
          Learning framework for network intrusion detection, achieving over 99.36%
          accuracy across all seven attack classes on CIC-IDS2017 without centralizing
          raw data; raised Web Attack F1-score from 0.20 (CNN baseline) to 0.93,
          outperforming LSTM, CNN+BiLSTM, and CNN+GRU variants
        - Built a novel file-entropy dataset and detection pipeline for crypto-ransomware,
          developing a custom FUSE-based filesystem to intercept file write/delete
          operations across 123 file types (30 ransomware strains, 93 benign);
          trained ML models achieving up to 96% detection accuracy
          (first-author, Springer LNNS 2025)
        - Evaluated cross-domain adversarial robustness and XAI explanation stability
          in phishing detection, comparing PGD and Carlini-Wagner attack accuracy
          alongside SHAP explanation drift across feature-engineered vs. raw-URL
          input representations (IEEE PECCII 2026)
        - Designed a two-stage CNN + Vision Transformer pipeline for video anomaly
          detection on the UCF-Crime dataset — 98% accuracy on binary classification,
          95% on multi-class categorization; introduced a keyframe extraction algorithm
          reducing per-video processing time to 20ms

