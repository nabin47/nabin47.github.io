    projects:
      - name: FL-IDS Framework
        date: "2022 – Present"
        highlights:
          - Privacy-preserving CNN-LSTM federated learning architecture for network
            intrusion detection across distributed clients without raw data sharing
          - Evaluated on CIC-IDS2017 across seven attack classes; 99.36% accuracy,
            Web Attack F1 raised from 0.20 to 0.93

      - name: Crypto-Ransomware Detection Pipeline
        date: "2023 – 2025"
        highlights:
          - Built a FUSE-based filesystem to capture file entropy signals across
            123 file types (30 ransomware families, 93 benign categories)
          - Trained ML classifiers achieving up to 96% detection accuracy;
            published first-author at Springer LNNS 2025

      - name: Adversarial Phishing Detection Study
        date: "2024 – 2026"
        highlights:
          - Measured SHAP explanation drift under PGD and Carlini-Wagner adversarial
            perturbations in phishing URL classifiers
          - Quantified cross-domain robustness gaps across feature-engineered vs.
            raw-URL input representations; published at IEEE PECCII 2026

      - name: Video Anomaly Detection System
        date: "2023 – 2025"
        highlights:
          - Two-stage CNN + Vision Transformer pipeline for spatial-temporal anomaly
            detection on the UCF-Crime dataset
          - Introduced a keyframe extraction algorithm reducing per-video processing
            time to 20ms; 98% binary and 95% multi-class accuracy

