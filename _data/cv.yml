- title: Research Experience
  type: time_table
  contents:
    - title: Independent Researcher
      institution: IUBAT / CUET
      year: 2023 – Present
      description:
        - Designed and implemented a CNN-LSTM federated learning framework for network intrusion detection, preserving privacy across distributed clients while maintaining competitive detection accuracy
        - Developed a two-stage video anomaly detection pipeline combining convolutional neural networks and vision transformers for temporal-spatial anomaly localization
        - Investigated cross-domain adversarial robustness (PGD and C&W attacks) and SHAP-based explainability stability in phishing detection systems; characterized explanation drift under adversarial perturbation
        - Built a multimodal (text + image) meme sentiment analysis system using XAI methods; extended methodology to procrastination level assessment via ML and SHAP-based behavioral feature analysis

